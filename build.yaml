targets:
  $default:
    builders:
      # ═══════════════════════════════════════════
      # JSON SERIALIZABLE
      # ═══════════════════════════════════════════
      json_serializable:
        options:
          any_map: false
          checked: false
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
          field_rename: snake_case      # ✅ SỬA: snake → snake_case
          generic_argument_factories: true
          ignore_unannotated: false
          include_if_null: false

      # ═══════════════════════════════════════════
      # FREEZED
      # ═══════════════════════════════════════════
      freezed:
        options:
          union_key: type
          union_value_case: pascal

      # ═══════════════════════════════════════════
      # RETROFIT — ✅ THÊM MỚI: fix warning toJson()
      # ═══════════════════════════════════════════
      retrofit_generator:
        options:
          retrofit_generator|retrofit_options:
            auto_cast_response: true

      # ═══════════════════════════════════════════
      # INJECTABLE
      # ═══════════════════════════════════════════
      injectable_generator:injectable_builder:
        options:
          auto_register: false
