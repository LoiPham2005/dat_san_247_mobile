instructions:
  - android:androidManifest
  - android:flavorizrGradle
  - android:dummyAssets
  - android:icons
  - ios:xcconfig
  - ios:plist
  - ios:runnerProject
  - ios:icons

app:
  android:
    flavorDimensions: "flavor"
  ios: {}

flavors:
  # ════════════════════════════════════════════════════════════
  # DEVELOPMENT
  # ════════════════════════════════════════════════════════════
  dev:
    app:
      name: "DatSan247 Dev"
    android:
      applicationId: "com.datsan247.dev"
      icon: "assets/icons/dev.png"
      firebase:
        config: "android/app/src/dev/google-services.json"
    ios:
      bundleId: "com.datsan247.dev"
      icon: "assets/icons/dev.png"
      firebase:
        config: "ios/Runner/dev/GoogleService-Info.plist"

  # ════════════════════════════════════════════════════════════
  # STAGING
  # ════════════════════════════════════════════════════════════
  stg:
    app:
      name: "DatSan247 Stg"
    android:
      applicationId: "com.datsan247.stg"
      icon: "assets/icons/stg.png"
      firebase:
        config: "android/app/src/stg/google-services.json"
    ios:
      bundleId: "com.datsan247.stg"
      icon: "assets/icons/stg.png"
      firebase:
        config: "ios/Runner/stg/GoogleService-Info.plist"

  # ════════════════════════════════════════════════════════════
  # PRODUCTION
  # ════════════════════════════════════════════════════════════
  prod:
    app:
      name: "DatSan247"
    android:
      applicationId: "com.datsan247"
      icon: "assets/icons/prod.png"
      firebase:
        config: "android/app/src/prod/google-services.json"
    ios:
      bundleId: "com.datsan247"
      icon: "assets/icons/prod.png"
      firebase:
        config: "ios/Runner/prod/GoogleService-Info.plist"
