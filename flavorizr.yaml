instructions:
  - android:androidManifest
  - android:flavorizrGradle
  - android:dummyAssets
  - android:icons
  - ios:xcconfig
  - ios:plist
  - ios:runnerProject
  - ios:icons

app:
  android:
    flavorDimensions: "flavor"
  ios: {}

flavors:
  # ════════════════════════════════════════════════════════════
  # DEVELOPMENT
  # ════════════════════════════════════════════════════════════
  dev:
    app:
      name: "MyApp Dev"
    android:
      applicationId: "com.example.flutter_base_template.dev"
      icon: "assets/icons/dev.png"
      # firebase:
      #   config: "firebase/dev/google-services.json"
    ios:
      bundleId: "com.example.flutter_base_template.dev"
      icon: "assets/icons/dev.png"
      # firebase:
      #   config: "firebase/dev/GoogleService-Info.plist"

  # ════════════════════════════════════════════════════════════
  # STAGING
  # ════════════════════════════════════════════════════════════
  stg:
    app:
      name: "MyApp Stg"
    android:
      applicationId: "com.example.flutter_base_template.stg"
      icon: "assets/icons/stg.png"
      # firebase:
      #   config: "firebase/staging/google-services.json"
    ios:
      bundleId: "com.example.flutter_base_template.stg"
      icon: "assets/icons/stg.png"
      # firebase:
      #   config: "firebase/staging/GoogleService-Info.plist"

  # ════════════════════════════════════════════════════════════
  # PRODUCTION
  # ════════════════════════════════════════════════════════════
  prod:
    app:
      name: "MyApp"
    android:
      applicationId: "com.example.flutter_base_template"
      icon: "assets/icons/prod.png"
      # firebase:
      #   config: "firebase/prod/google-services.json"
    ios:
      bundleId: "com.example.flutter_base_template"
      icon: "assets/icons/prod.png"
      # firebase:
      #   config: "firebase/prod/GoogleService-Info.plist"
